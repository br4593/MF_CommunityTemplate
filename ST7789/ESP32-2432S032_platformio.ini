; ******************************************************************************************
; working environment for template of custom firmware
; ******************************************************************************************
; Common build settings across this custom device
[env_template]
build_flags =
	${env.build_flags}												; include standard build flags
	-DMF_CUSTOMDEVICE_SUPPORT=1										; Required for Custom Devices
	;-DMF_CUSTOMDEVICE_HAS_UPDATE									; if the custom device needs to be updated, uncomment this. W/o the following define it will be done each loop()
	;-DMF_CUSTOMDEVICE_POLL_MS=10 									; time in ms between updating custom device, uncomment this if custom device needs to be updated regulary
	;-DHAS_CONFIG_IN_FLASH											; undefine this and add your configuration to MFCustomDevicesConfig.h to save the config in Flash !!Core FW version must be at least 2.5.2!!
	-I./src/src/MF_CustomDevice										; don't change this one!
	-I./ST7789													; Include files for your custom device, replace "Template" by your folder name
build_src_filter = 
	+<../ST7789>													; build files for your custom device, replace "Template" by your folder name
lib_deps =															; You can add additional libraries if required
custom_core_firmware_version = ESP32_support	; CAUTION check get_version.py								; define the version from the core firmware files your build should base on
custom_source_folder = ST7789										; path to your Custom Device Sources, replace "Template" by your folder name
custom_community_project = esp32-s2432s032_st7789							; name of the ZIP file, revision will be added during build process
custom_community_folder = esp32-s2432s032_st7789							; Folder name inside zip file

	; don't change this one!

[env:mobiflight_template_esp32_2432s032]
platform = espressif32
board = esp32dev
framework = arduino
lib_ldf_mode = deep+
monitor_speed = 115200
build_flags =
    ${env_template.build_flags}
	-I./src/_Boards/ESP32/ESP32_2432S032
    '-DMOBIFLIGHT_TYPE="MobiFlight ESP32-2432S032"'
    '-DMOBIFLIGHT_NAME="MobiFlight ESP32-2432S032"'
    -DBUFFER_LENGTH=I2C_BUFFER_LENGTH
build_unflags =
    -Wdeprecated-declarations
build_src_filter =
    ${env.build_src_filter}
    ${env_template.build_src_filter}
lib_deps =
	${env.lib_deps}
	${env.custom_lib_deps_ESP32}											; don't change this one!
	${env_template.lib_deps}
    Bodmer/TFT_eSPI @ ^2.5.31
	tamctec/TAMC_GT911@^1.0.2
	adafruit/Adafruit GFX Library@^1.11.11
extra_scripts =
    ${env.extra_scripts}

board_upload.flash_size = 4MB
board_build.partitions = default.csv
board_build.psram = disabled
upload_speed = 921600
custom_core_firmware_version = ${env_template.custom_core_firmware_version}
custom_community_project = ${env_template.custom_community_project}
custom_source_folder = ${env_template.custom_source_folder}
custom_community_folder = ${env_template.custom_community_folder}
